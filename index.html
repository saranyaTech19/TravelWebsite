    <style>
        * {
            font-family: 'Poppins', sans-serif !important;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --global-padding-top: 30px;
            --global-padding-bottom: 30px;
            --global-padding-left: 20px;
            --global-padding-right: 20px;
        }

        .global-page-container {
            padding-top: var(--global-padding-top);
            padding-bottom: var(--global-padding-bottom);
            padding-left: var(--global-padding-left);
            padding-right: var(--global-padding-right);
        }

        .hero-gradient {
            background: linear-gradient(90deg, rgba(15, 36, 84, 0.8) 0%, rgba(15, 36, 84, 0.4) 50%, rgba(15, 36, 84, 0) 100%);
        }

        .brush-highlight {
            position: relative;
            z-index: 1;
        }

        .brush-highlight::after {
            content: '';
            position: absolute;
            left: -5%;
            bottom: 15%;
            width: 110%;
            height: 45%;
            background-color: #0fb7fb;
            z-index: -1;
            transform: rotate(-1.5deg);
            opacity: 0.9;
            border-radius: 4px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-down {
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
